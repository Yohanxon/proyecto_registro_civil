<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · Registro Civil</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="logo-icon"><i class="fas fa-gavel"></i></div>
    <h2>Registro Civil · Jiménez</h2>
    <p style="color:var(--text-muted); margin-bottom: 1.5rem;">Acceso al panel administrativo</p>
    <form>
      <div class="form-group">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" placeholder="admin" value="admin">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" value="123456">
      </div>
      <a href="dashboard.html" class="btn btn-primary" style="width:100%; justify-content:center; margin-top:0.5rem;">
        <i class="fas fa-sign-in-alt"></i> Ingresar
      </a>
    </form>
    <p style="margin-top:1.2rem; font-size:0.85rem; color:var(--text-muted);">
      <i class="fas fa-info-circle"></i> Usuario: admin / Pass: 123456
    </p>
  </div>
</body>
</html>
